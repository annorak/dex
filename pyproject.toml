[project]
name = "dex"
version = "0.1.0"
description = "CLI scaffold for dex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build==0.11.31"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dex"
module-root = ""
namespace = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["dex", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
